version: '3'
services:
  postgres:
    image: postgres:15.3
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pda_db
      - TZ=Europe/Athens
    container_name: postgres
    ports:
      - 5436:5432
    expose:
      - 5436
    volumes:
      - ./data:/data/db
