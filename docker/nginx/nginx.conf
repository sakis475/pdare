events {}

http {
    server {
    listen 80;
    server_name ${SERVER_NAME};  # or your public IP

    location ^~ /apif33d6f185eeed64d8/v1 {
        proxy_pass http://localhost:8000;  # your Node.js port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
	
    location ^~ /socket.io {
        proxy_pass http://localhost:8000;  # your Node.js port
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        return 403;
    }
}
}
